; Alembic configuration.
;
; The database URL is deliberately NOT here — infra/migrations/env.py reads it
; from neura-core settings, so migrations and the application can never disagree
; about which database they are talking to.

[alembic]
script_location = infra/migrations
prepend_sys_path = .
version_path_separator = os

; Migration filenames sort chronologically and read as a changelog:
;   0001_document_chunks.py, 20260801_1430_add_conversations.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
