[project]
name = "neura-dispatch"
version = "0.1.0"
description = "Choosing which agent answers a shopper's message — ADR-0031"
requires-python = ">=3.12,<3.13"

# Must NOT depend on any agent package, for the same reason `neura-agent-core`
# must not: the dispatcher chooses *between* agents by reading their declared
# manifests, and a dispatcher that imported one would be a dispatcher that knew
# which agents exist. `routes/agent.py` does not know the word "care" and neither
# may this.
dependencies = [
    "neura-core",
    "neura-evals",
]

# The dispatcher is measured like an agent and is not one — [ADR-0031] §6. Every
# other golden dataset in this repository lives inside an agent package, so a
# dispatcher graded by the existing mechanism had nowhere to keep its cases.
# Discovery never required the target to *be* an agent; only the datasets did.
[project.entry-points."neura.eval_targets"]
dispatch = "neura_dispatch.evals:build_target"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_dispatch"]
