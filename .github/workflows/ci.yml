name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  quality:
    name: Lint · Types · Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen
        name: Install dependencies

      - run: uv run ruff check .
        name: Lint

      - run: uv run ruff format --check .
        name: Format check

      - run: uv run mypy packages apps agents
        name: Typecheck (strict)

      # The two checks that keep the architecture honest. Boundaries that are
      # not mechanically enforced erode within weeks.
      - run: uv run lint-imports
        name: Layering contracts

      - run: uv run python scripts/check_platform_independence.py
        name: Platform independence

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen
        name: Install dependencies

      - run: uv run pytest tests/unit -v
        name: Unit tests

      - run: uv run pytest tests/integration -v -m integration
        name: Integration tests
        if: hashFiles('tests/integration/test_*.py') != ''
        env:
          DATABASE_URL: postgresql+asyncpg://neura:neura@localhost:5432/neura
          REDIS_URL: redis://localhost:6379/0

  # Agent evaluations gate behaviour changes: prompts, graph nodes, tools and
  # model config. See docs/architecture/evaluation-strategy.md §4.
  #
  # What runs here is the JUDGE-FREE, MODEL-FREE subset — the datasets parse,
  # every case is well-formed, and the scoring logic works. It is fast, free and
  # needs no secret.
  #
  # It deliberately does NOT run the agent. Since milestone 1.11 there is a real
  # agent to run, and running it needs Ollama and several minutes per turn on a
  # GPU this runner does not have. A job that could only ever fail for
  # environmental reasons was previously kept green with `continue-on-error`,
  # which is the same thing as not running it while looking like running it.
  #
  # The full suite (`make eval`) is a local, pre-merge step against real models,
  # and its numbers are recorded in docs/PROJECT_STATE.md. Judged metrics
  # (groundedness) additionally need a paid judge — open question E2.
  #
  # The guard's own balanced corpus — 40 attack strings and 40 benign ones —
  # is deterministic and needs no model, so it runs in the `test` job above and
  # gates every push (ADR-0011).
  evaluate:
    name: Agent evaluations (datasets + harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen
        name: Install dependencies

      - run: uv run neura-eval --no-judge --no-agent
        name: Evals (datasets + harness only)
