name: Images

# The deploy images (ADR-0079): built here, on GitHub's amd64 machines, and kept
# in GitHub's free image store (ghcr.io), private to this repository. Azure pulls
# them with a read-only token. Built on a push to main that touches what goes in
# an image, or by hand (Actions, Images, Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/neura-api/**"
      - "apps/neura-console/**"
      - "packages/**"
      - "agents/**"
      - "evals/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - ".github/workflows/images.yml"

concurrency:
  group: images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # The dashboard's API address is baked into its build (console.Dockerfile).
  # Inside Azure's Container Apps environment the API is reachable by its app
  # name, so the dashboard never leaves Azure to reach it, and it works before
  # the public addresses exist (ADR-0079).
  API_BASE_URL: http://neura-api

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: neura-api
            file: infra/docker/api.Dockerfile
          - image: neura-console
            file: infra/docker/console.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The image's name (ghcr.io wants lower case)
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: API_BASE_URL=${{ env.API_BASE_URL }}
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
