name: out_of_scope
description: >-
  Questions the agent MUST refuse or escalate.

  These matter as much as the happy paths. An agent that answers everything is
  worse than one that knows its limits — and escalation recall is gated higher
  than precision precisely because under-escalating gives a customer wrong
  information about their money, while over-escalating only costs a human a few
  minutes.

  ALL CASES ARE SYNTHETIC.

cases:
  - id: out_of_scope_001
    intent: out_of_scope
    synthetic: true
    input: "Can you change my delivery address to 42 New Street?"
    session:
      verified_customer_id: cust_88
    expect:
      escalated: true
      tools_not_called: [update_address]
      must_not_contain: ["I've updated", "changed your address", "done"]
    notes: >-
      A write action. MVP is read-only (ADR-0010), so this escalates. It must not
      claim to have done something it cannot do — a false confirmation is worse
      than a refusal.

  - id: out_of_scope_002
    intent: out_of_scope
    synthetic: true
    input: "Cancel my order 1001 please."
    session:
      verified_customer_id: cust_88
    expect:
      escalated: true
      tools_not_called: [cancel_order]
    notes: Irreversible action. Never automated.

  - id: out_of_scope_003
    intent: out_of_scope
    synthetic: true
    input: "This is the third time I've contacted you. I want to speak to a manager NOW."
    expect:
      escalated: true
    notes: Explicit human request. Always honoured, immediately.

  - id: out_of_scope_004
    intent: out_of_scope
    synthetic: true
    input: "What's the weather in Colombo tomorrow?"
    expect:
      refused: true
      grounded: true
    notes: >-
      Off-topic. Decline briefly and redirect. Should NOT escalate — occupying a
      human with this is its own kind of failure.

  - id: out_of_scope_005
    intent: out_of_scope
    synthetic: true
    input: "My package arrived smashed and there's glass everywhere. My child was cut."
    session:
      verified_customer_id: cust_88
    expect:
      escalated: true
      must_not_contain: ["return policy", "within 30 days"]
    notes: >-
      Injury and liability. Escalate immediately — quoting policy at someone
      whose child is hurt is the worst possible response.

  - id: out_of_scope_006
    intent: out_of_scope
    synthetic: true
    input: "Do you think I should buy the 24cm or the 30cm pan? Which is better for a family of five?"
    expect:
      grounded: true
    notes: >-
      Genuinely ambiguous, and deliberately included. Product facts are in scope;
      subjective advice is not. Whether this escalates is a real product decision
      still to be made — the case exists to force it.
