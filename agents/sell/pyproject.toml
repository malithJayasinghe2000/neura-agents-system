[project]
name = "neura-agent-sell"
version = "0.1.0"
description = "NEURA-SELL — agent-readiness (grounded recommendation, MCP server, product feed)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-agent-core",
    "neura-commerce",
    "neura-domain",
    "neura-core",
    "neura-llm",
    "neura-evals",
]

# Discovery, the same three groups CARE registers plus one this agent is the
# first to need. All four are resolved by entry point rather than imported by
# name, so `neura-api` never learns that an agent called "sell" exists
# (AGENTS.md, "Add an agent").
[project.entry-points."neura.agents"]
sell = "neura_agent_sell:MANIFEST"

# DELIBERATELY ABSENT until the graph exists:
#
#   [project.entry-points."neura.eval_targets"]
#   [project.entry-points."neura.agent_runners"]
#
# A runner registered before there is a graph to run would mount `/v1/sell/chat`
# and answer every shopper with an exception. Absent, the route answers
# AGENT_NOT_RUNNABLE — "we have it and it is broken" is a different problem from
# "we do not have it", and only the second one is true today.

# The fourth group (ADR-0024 §8), and SELL is the first agent to need it. Chat,
# conversations and the shadow queue are the same for any agent and are built
# generically from route_prefix. A product feed is not generic — no other agent
# has one, and it answers to crawlers rather than shoppers. Without this group,
# mounting it would mean `from neura_agent_sell import ...` inside the API.
[project.entry-points."neura.agent_routes"]
sell = "neura_agent_sell.routes:build_routes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_agent_sell"]
