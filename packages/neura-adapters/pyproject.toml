[project]
name = "neura-adapters"
version = "0.1.0"
description = "Commerce platform adapters — the ONLY place a platform name may appear"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-core",
    "neura-domain",
    "neura-commerce",
    "httpx>=0.28",
    "rich>=13.9",
]

# The tool a merchant's developer runs against their own store. Shipped from
# this package because it checks one specific integration tier, not the
# platform-neutral adapter contract.
[project.scripts]
neura-conformance = "neura_adapters.generic.cli:main"

# How the core finds adapters without importing them (neura_commerce.registry).
[project.entry-points."neura.adapters"]
generic = "neura_adapters.generic:GenericAdapter"

# How the developer MCP server finds what it teaches, without importing this
# package (ADR-0053; the same fence as above).
[project.entry-points."neura.bridge_teacher"]
generic = "neura_adapters.generic.teacher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_adapters"]
