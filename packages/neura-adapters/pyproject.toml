[project]
name = "neura-adapters"
version = "0.1.0"
description = "Commerce platform adapters — the ONLY place a platform name may appear"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-core",
    "neura-domain",
    "neura-commerce",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_adapters"]
