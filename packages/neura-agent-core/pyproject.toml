[project]
name = "neura-agent-core"
version = "0.1.0"
description = "Agent engine — graph runtime, shared nodes, tool registry, policy engine, memory"
requires-python = ">=3.12,<3.13"

# Must NOT depend on any agent package. The engine must never learn that
# NEURA-CARE exists — same rule, same reason, as neura-commerce not knowing
# Shopify exists. Enforced by CI.
dependencies = [
    "neura-core",
    "neura-domain",
    "neura-llm",
    "neura-commerce",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_agent_core"]
