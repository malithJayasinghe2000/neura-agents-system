name: Website

# The public website (ADR-0051: static files only) on GitHub Pages, free, at
# neura.fiveneurals.com (R132; public/CNAME names the address). Built on a push
# to main that touches the site or the OpenAPI file it serves, or by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/neura-web/**"
      - "docs/spec/openapi.json"
      - ".github/workflows/web.yml"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neura-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/neura-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/neura-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
