[project]
name = "neura-agent-care"
version = "0.1.0"
description = "NEURA-CARE — customer experience agent (order status, product Q&A, policy)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-agent-core",
    "neura-commerce",
    "neura-domain",
    "neura-core",
    "neura-llm",
    # The agent ships its own golden dataset and the target that runs it —
    # "no agent ships without one" (AGENTS.md). That puts the dependency this
    # way round: the agent knows how to be evaluated, and `neura-evals` stays
    # ignorant of which agents exist. A contract in the root pyproject keeps the
    # harness out of the serving path.
    "neura-evals",
]

# How the system discovers this agent at startup. No central registry file to
# edit — see docs/architecture/tenancy-and-packaging.md §2.5.
[project.entry-points."neura.agents"]
care = "neura_agent_care:MANIFEST"

# How `make eval` finds something real to measure. Same mechanism, same reason:
# the eval CLI resolves targets and datasets by entry point rather than importing
# an agent by name, so adding agent #2 needs no edit to the harness.
[project.entry-points."neura.eval_targets"]
care = "neura_agent_care.evals:build_target"

# How the API turns a request into a turn (milestone 1.14). The third seam of
# the same shape and for the same reason: `neura-api` resolves a runner by entry
# point rather than importing an agent by name, so the deployable never learns
# which products it is serving.
[project.entry-points."neura.agent_runners"]
care = "neura_agent_care.serving:build_runner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_agent_care"]
