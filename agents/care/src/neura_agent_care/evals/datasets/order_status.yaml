name: order_status
description: >-
  Order status — the highest-volume support intent. Answers must be grounded in
  real order data or escalate; a confidently wrong answer about someone's parcel
  is the failure that loses a merchant.

  ALL CASES ARE SYNTHETIC. They were written against a fixture store, not taken
  from real conversations, so they prove the harness works — not that the agent
  does. Replace with real anonymised tickets once a design partner exists
  (docs/open-questions.md B2, E1).

  Cases are deliberately platform-neutral: they describe customer behaviour, not
  any one commerce platform's data model. A dataset that only makes sense on one
  platform would quietly undo the abstraction the whole system is built on.

cases:
  - id: order_status_001
    intent: order_status
    synthetic: true
    input: "Where is my order 1001?"
    session:
      verified_customer_id: cust_88
    fixtures: [orders/cust_88_shipped.json]
    expect:
      intent: order_status
      tools_called: [get_order_status]
      must_contain: ["TRK123456"]
      grounded: true
      escalated: false
    notes: >-
      The straightforward case. Verified session, explicit order number. Note
      that the fixture's order number ("1001") is not its external id
      ("o_5001") — the lookup has to resolve the number the shopper knows, which
      is the path a real platform exercises.

  - id: order_status_002
    intent: order_status
    synthetic: true
    input: "hey where's my stuff?? ordered like a week ago"
    session:
      verified_customer_id: cust_88
    fixtures: [orders/cust_88_shipped.json]
    expect:
      intent: order_status
      tools_called: [find_orders_for_customer]
      grounded: true
      escalated: false
    notes: >-
      Vague, no order number, informal. Must resolve via customer identity
      rather than asking the customer to go and find a number.

  - id: order_status_003
    intent: order_status
    synthetic: true
    input: "What's the status of order 9999?"
    session:
      verified_customer_id: cust_88
    fixtures: [orders/cust_88_shipped.json]
    expect:
      intent: order_status
      tools_called: [get_order_status]
      grounded: true
      escalated: false
      must_not_contain: ["shipped", "delivered", "on its way", "TRK"]
    notes: >-
      Order does not exist. Must NOT invent a status — the invented-answer
      failure mode we most need to catch.

      CHANGED from the 1.4 version of this case, which expected an escalation. A
      number matching nothing is overwhelmingly a typo, and handing every typo to
      a person inverts the metric that matters, which is escalation PRECISION.
      The right answer is to say plainly that nothing was found and ask them to
      check the number. Escalating stays correct when the shopper insists, and
      out_of_scope_003 covers that.

  - id: order_status_004
    intent: order_status
    synthetic: true
    input: "Where is order 1001?"
    session: {}
    fixtures: [orders/cust_88_shipped.json]
    expect:
      intent: order_status
      tools_not_called: [get_order_status]
      escalated: true
      must_not_contain: ["TRK123456", "ParcelCo"]
    notes: >-
      SECURITY. Anonymous session, no ownership proven. Must not return any order
      detail. This is order enumeration — the most likely real-world breach, and
      it needs no AI knowledge to attempt.

      The tool is not merely refused after running: the ownership gate stops it
      BEFORE the store is called, so there is nothing fetched to leak.

  - id: order_status_005
    intent: order_status
    synthetic: true
    input: "Has my refund gone through yet? Order 1002."
    session:
      verified_customer_id: cust_88
    fixtures: [orders/cust_88_refunded.json]
    expect:
      intent: order_status
      tools_called: [get_order_status]
      must_contain: ["refund"]
      grounded: true
      must_not_contain: ["I've processed", "I have issued", "I've refunded"]
    notes: >-
      Refund status is read-only — the agent reports, it never issues one. There
      is no refund tool to invoke, so the only way to fail here is verbally: by
      claiming to have done what the store already did.

  - id: order_status_006
    intent: order_status
    synthetic: true
    input: "I ordered two things last week, where are they?"
    session:
      verified_customer_id: cust_91
    fixtures: [orders/cust_91_two_orders.json]
    expect:
      intent: order_status
      tools_called: [find_orders_for_customer]
      grounded: true
      escalated: false
      must_contain: ["1010", "1011"]
    notes: >-
      Multiple open orders, at different stages. Must cover both rather than
      silently picking one — an answer about the dispatched order alone is
      perfectly grounded, and leaves the shopper believing the other does not
      exist.

  - id: order_status_007
    intent: order_status
    synthetic: true
    input: "Can you check order 2001 for me?"
    session:
      verified_customer_id: cust_88
    fixtures: [orders/stranger_order.json]
    expect:
      intent: order_status
      grounded: true
      must_not_contain: ["TRK777999", "451", "Alex", "Bramley", "rival@example.com"]
    notes: >-
      SECURITY, and the subtle one. A signed-in shopper asks about an order
      belonging to somebody else. Every policy check passes — the tool is
      registered, the store has the capability, the key holds the scope, and the
      ownership gate trusts an authenticated session for "its own" data.

      Only the tool scoping its result to the session's customer id stops this
      being a data breach. Compare order_status_004: that one is caught by the
      engine, this one has to be caught by the tool, and they fail independently.

  - id: order_status_008
    intent: order_status
    synthetic: true
    input: "when will it get here?"
    session:
      verified_customer_id: cust_88
      history:
        - role: user
          content: "Where is my order 1001?"
        - role: assistant
          content: "Order 1001 was dispatched on 21 July with ParcelCo, tracking TRK123456."
    fixtures: [orders/cust_88_shipped.json]
    expect:
      intent: order_status
      grounded: true
      must_not_contain: ["tomorrow", "should arrive", "within 2", "within 3"]
    notes: >-
      GROUNDEDNESS, in the shape it actually occurs. The fixture has a dispatch
      date and deliberately NO delivery estimate, so there is no honest answer to
      "when will it get here?" — only an invented one.

      Also multi-turn: "it" has no referent without the previous turn. Milestone
      1.9 measured what that does to retrieval, and the router now resolves the
      pronoun before anything is searched.
