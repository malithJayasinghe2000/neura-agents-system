[project]
name = "neura-domain"
version = "0.1.0"
description = "Canonical commerce domain model — platform-neutral, pure, zero I/O"
requires-python = ">=3.12,<3.13"

# INTENTIONALLY only Pydantic. This package is the vocabulary the whole system
# shares; keeping it pure is what allows every other layer to be swapped.
# Enforced by the import-linter contract in the workspace root.
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_domain"]
