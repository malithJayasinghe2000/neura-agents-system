[project]
name = "neura-llm"
version = "0.1.0"
description = "LLM provider abstraction by model role — Ollama (dev/sovereign) and cloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-core",
    "neura-domain",
    # Every provider is driven through the OpenAI-compatible API surface, which
    # Ollama also exposes at /v1. One code path, not two. See ADR-0006.
    "openai>=1.60",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_llm"]
