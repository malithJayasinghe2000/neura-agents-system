[project]
name = "neura-evals"
version = "0.1.0"
description = "Agent evaluation harness — golden datasets, metrics, judge, reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-core",
    "neura-domain",
    "pyyaml>=6.0",
    "openai>=1.60",
    "rich>=13.9",
]

[project.scripts]
neura-eval = "neura_evals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_evals"]
