[project]
name = "neura-api"
version = "0.1.0"
description = "The deployable — FastAPI app and worker entrypoint"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neura-core",
    "neura-domain",
    "neura-llm",
    "neura-commerce",
    "neura-adapters",
    "neura-agent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.scripts]
neura-api = "neura_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neura_api"]
